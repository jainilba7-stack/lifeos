<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments — LifeOS</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="brand">LifeOS</div></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><span>📊</span> Dashboard</a>
        <a href="tasks.html" class="nav-link"><span>📝</span> Tasks</a>
        <a href="expenses.html" class="nav-link"><span>💰</span> Expenses & Budget</a>
        <a href="medicines.html" class="nav-link"><span>💊</span> Medicine Vault</a>
        <a href="documents.html" class="nav-link"><span>📂</span> Document Vault</a>
        <a href="goals.html" class="nav-link"><span>🎯</span> Goals</a>
        <a href="habits.html" class="nav-link"><span>🔥</span> Habit Tracker</a>
        <a href="appointments.html" class="nav-link active"><span>📅</span> Appointments</a>
        <a href="notes.html" class="nav-link"><span>📌</span> Notes</a>
        <a href="reminders.html" class="nav-link"><span>🔔</span> Reminders</a>
        <a href="analytics.html" class="nav-link"><span>📈</span> Analytics</a>
        <a href="emergency.html" class="nav-link"><span>🆘</span> Emergency Card</a>
        <a href="profile.html" class="nav-link"><span>⚙️</span> Settings & Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="logoutUser()" class="btn btn-danger" style="width: 100%;">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h2>Appointment Manager</h2>
        <button id="add-appt-btn" class="btn btn-primary">+ New Appointment</button>
      </header>

      <main class="content-body">
        <div id="appointments-container"></div>
      </main>
    </div>
  </div>

  <div id="appt-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Schedule Appointment</h3>
        <button type="button" id="cancel-appt-btn" style="color: var(--text-muted);">✕</button>
      </div>
      <form id="appt-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="appt-title">Title</label>
            <input type="text" id="appt-title" class="form-control" placeholder="e.g. Doctor Consultation" required>
          </div>
          <div class="form-group">
            <label for="appt-person">Person / Organization</label>
            <input type="text" id="appt-person" class="form-control" placeholder="e.g. Dr. Sharma / HDFC Bank" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="appt-date">Date</label>
              <input type="date" id="appt-date" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="appt-time">Time</label>
              <input type="time" id="appt-time" class="form-control" required value="10:00">
            </div>
          </div>
          <div class="form-group">
            <label for="appt-location">Location / Link</label>
            <input type="text" id="appt-location" class="form-control" placeholder="e.g. City Hospital, Room 204">
          </div>
          <div class="form-group">
            <label for="appt-notes">Notes</label>
            <textarea id="appt-notes" class="form-control" rows="2" placeholder="Preparation notes..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Appointment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/appointments.js"></script>
</body>
</html>
