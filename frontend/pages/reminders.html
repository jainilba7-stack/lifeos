<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Reminders — LifeOS</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="brand">LifeOS</div></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><span>📊</span> Dashboard</a>
        <a href="tasks.html" class="nav-link"><span>📝</span> Tasks</a>
        <a href="expenses.html" class="nav-link"><span>💰</span> Expenses & Budget</a>
        <a href="medicines.html" class="nav-link"><span>💊</span> Medicine Vault</a>
        <a href="documents.html" class="nav-link"><span>📂</span> Document Vault</a>
        <a href="goals.html" class="nav-link"><span>🎯</span> Goals</a>
        <a href="habits.html" class="nav-link"><span>🔥</span> Habit Tracker</a>
        <a href="appointments.html" class="nav-link"><span>📅</span> Appointments</a>
        <a href="notes.html" class="nav-link"><span>📌</span> Notes</a>
        <a href="reminders.html" class="nav-link active"><span>🔔</span> Reminders</a>
        <a href="analytics.html" class="nav-link"><span>📈</span> Analytics</a>
        <a href="emergency.html" class="nav-link"><span>🆘</span> Emergency Card</a>
        <a href="profile.html" class="nav-link"><span>⚙️</span> Settings & Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="logoutUser()" class="btn btn-danger" style="width: 100%;">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h2>Central Reminder System</h2>
        <div style="display: flex; gap: 0.75rem;">
          <button id="test-alarm-btn" class="btn btn-secondary">🔊 Test Alarm Sound</button>
          <button id="add-reminder-btn" class="btn btn-primary">+ Create Reminder</button>
        </div>
      </header>

      <main class="content-body">
        <div id="reminders-container"></div>
      </main>
    </div>
  </div>

  <div id="reminder-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Create Scheduled Reminder</h3>
        <button type="button" id="cancel-rem-btn" style="color: var(--text-muted);">✕</button>
      </div>
      <form id="reminder-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="rem-title">Title</label>
            <input type="text" id="rem-title" class="form-control" placeholder="e.g. Electricity Bill Due" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="rem-type">Type</label>
              <select id="rem-type" class="form-control">
                <option value="Bill">Bill</option>
                <option value="Birthday">Birthday</option>
                <option value="Appointment">Appointment</option>
                <option value="Document">Document</option>
                <option value="Medicine">Medicine</option>
                <option value="Task">Task</option>
                <option value="Personal">Personal</option>
              </select>
            </div>
            <div class="form-group">
              <label for="rem-datetime">Date & Time</label>
              <input type="datetime-local" id="rem-datetime" class="form-control" required>
            </div>
          </div>
          <div class="form-group">
            <label for="rem-repeat">Repeat Frequency</label>
            <select id="rem-repeat" class="form-control">
              <option value="none">One-time</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
          <div class="form-group">
            <label for="rem-notes">Notes</label>
            <textarea id="rem-notes" class="form-control" rows="2" placeholder="Optional notes..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Schedule Reminder</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/reminders.js"></script>
</body>
</html>
