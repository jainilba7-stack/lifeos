<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — LifeOS</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="auth-logo">LifeOS</a>
        <h2 style="font-size: 1.4rem; margin-top: 0.5rem;">Create New Password</h2>
        <p class="auth-subtitle">Enter the 6-digit OTP code sent to your email along with your new password.</p>
      </div>

      <form id="reset-password-form">
        <div class="form-group">
          <label for="otp">Reset OTP Code</label>
          <input type="text" id="otp" class="form-control" placeholder="6-digit OTP" required minlength="6" maxlength="6">
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">Reset Password</button>
      </form>

      <div class="auth-footer">
        Back to <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
