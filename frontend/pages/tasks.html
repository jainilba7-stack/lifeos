<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management — LifeOS</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="brand">LifeOS</div></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><span>📊</span> Dashboard</a>
        <a href="tasks.html" class="nav-link active"><span>📝</span> Tasks</a>
        <a href="expenses.html" class="nav-link"><span>💰</span> Expenses & Budget</a>
        <a href="medicines.html" class="nav-link"><span>💊</span> Medicine Vault</a>
        <a href="documents.html" class="nav-link"><span>📂</span> Document Vault</a>
        <a href="goals.html" class="nav-link"><span>🎯</span> Goals</a>
        <a href="habits.html" class="nav-link"><span>🔥</span> Habit Tracker</a>
        <a href="appointments.html" class="nav-link"><span>📅</span> Appointments</a>
        <a href="notes.html" class="nav-link"><span>📌</span> Notes</a>
        <a href="reminders.html" class="nav-link"><span>🔔</span> Reminders</a>
        <a href="analytics.html" class="nav-link"><span>📈</span> Analytics</a>
        <a href="emergency.html" class="nav-link"><span>🆘</span> Emergency Card</a>
        <a href="profile.html" class="nav-link"><span>⚙️</span> Settings & Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="logoutUser()" class="btn btn-danger" style="width: 100%;">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h2>Task Management</h2>
        <button id="add-task-btn" class="btn btn-primary">+ Create Task</button>
      </header>

      <main class="content-body">
        <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; background: var(--bg-surface); padding: 1rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
          <div style="flex: 1; min-width: 200px;">
            <input type="text" id="task-search-input" class="form-control" placeholder="Search tasks...">
          </div>
          <select id="task-status-filter" class="form-control" style="width: 150px;">
            <option value="All">All Tasks</option>
            <option value="today">Today</option>
            <option value="upcoming">Upcoming</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
          <select id="task-priority-filter" class="form-control" style="width: 150px;">
            <option value="All">All Priorities</option>
            <option value="Urgent">Urgent</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
          <select id="task-category-filter" class="form-control" style="width: 150px;">
            <option value="All">All Categories</option>
            <option value="Personal">Personal</option>
            <option value="College">College</option>
            <option value="Work">Work</option>
            <option value="Health">Health</option>
            <option value="Finance">Finance</option>
          </select>
        </div>

        <div id="tasks-container"></div>
      </main>
    </div>
  </div>

  <div id="task-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-title">Create New Task</h3>
        <button type="button" id="cancel-task-btn" style="color: var(--text-muted); font-size: 1.2rem;">✕</button>
      </div>
      <form id="task-form">
        <div class="modal-body">
          <input type="hidden" id="task-id">
          <div class="form-group">
            <label for="task-title">Task Title</label>
            <input type="text" id="task-title" class="form-control" placeholder="e.g. Complete DSA assignment" required>
          </div>
          <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea id="task-desc" class="form-control" rows="3" placeholder="Optional details..."></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="task-category">Category</label>
              <select id="task-category" class="form-control">
                <option value="Personal">Personal</option>
                <option value="College">College</option>
                <option value="Work">Work</option>
                <option value="Health">Health</option>
                <option value="Finance">Finance</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="task-priority">Priority</label>
              <select id="task-priority" class="form-control">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="task-duedate">Due Date</label>
            <input type="date" id="task-duedate" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/tasks.js"></script>
</body>
</html>
