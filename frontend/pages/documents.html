<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Vault — LifeOS</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="brand">LifeOS</div></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><span>📊</span> Dashboard</a>
        <a href="tasks.html" class="nav-link"><span>📝</span> Tasks</a>
        <a href="expenses.html" class="nav-link"><span>💰</span> Expenses & Budget</a>
        <a href="medicines.html" class="nav-link"><span>💊</span> Medicine Vault</a>
        <a href="documents.html" class="nav-link active"><span>📂</span> Document Vault</a>
        <a href="goals.html" class="nav-link"><span>🎯</span> Goals</a>
        <a href="habits.html" class="nav-link"><span>🔥</span> Habit Tracker</a>
        <a href="appointments.html" class="nav-link"><span>📅</span> Appointments</a>
        <a href="notes.html" class="nav-link"><span>📌</span> Notes</a>
        <a href="reminders.html" class="nav-link"><span>🔔</span> Reminders</a>
        <a href="analytics.html" class="nav-link"><span>📈</span> Analytics</a>
        <a href="emergency.html" class="nav-link"><span>🆘</span> Emergency Card</a>
        <a href="profile.html" class="nav-link"><span>⚙️</span> Settings & Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="logoutUser()" class="btn btn-danger" style="width: 100%;">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h2>Document Vault</h2>
        <button id="upload-doc-btn" class="btn btn-primary">+ Upload Document</button>
      </header>

      <main class="content-body">
        <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
          <select id="document-category-filter" class="form-control" style="width: 200px;">
            <option value="All">All Categories</option>
            <option value="Aadhaar">Aadhaar</option>
            <option value="PAN">PAN</option>
            <option value="Passport">Passport</option>
            <option value="Driving Licence">Driving Licence</option>
            <option value="Insurance">Insurance</option>
            <option value="Certificates">Certificates</option>
            <option value="Education">Education</option>
            <option value="Vehicle">Vehicle</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div id="documents-grid" class="document-grid"></div>
      </main>
    </div>
  </div>

  <div id="document-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Upload Document to Vault</h3>
        <button type="button" id="cancel-doc-btn" style="color: var(--text-muted);">✕</button>
      </div>
      <form id="document-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="doc-file">Select File (PDF, Image, Doc)</label>
            <input type="file" id="doc-file" class="form-control" required accept=".pdf,.png,.jpg,.jpeg,.doc,.docx">
          </div>
          <div class="form-group">
            <label for="doc-name">Document Title</label>
            <input type="text" id="doc-name" class="form-control" placeholder="e.g. Driving Licence" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="doc-category">Category</label>
              <select id="doc-category" class="form-control">
                <option value="Aadhaar">Aadhaar</option>
                <option value="PAN">PAN</option>
                <option value="Passport">Passport</option>
                <option value="Driving Licence" selected>Driving Licence</option>
                <option value="Insurance">Insurance</option>
                <option value="Certificates">Certificates</option>
                <option value="Education">Education</option>
                <option value="Vehicle">Vehicle</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="doc-expiry">Expiry Date (Optional)</label>
              <input type="date" id="doc-expiry" class="form-control">
            </div>
          </div>
          <div class="form-group">
            <label for="doc-desc">Description</label>
            <textarea id="doc-desc" class="form-control" rows="2" placeholder="Optional notes..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Upload Document</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/documents.js"></script>
</body>
</html>
