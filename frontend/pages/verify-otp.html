<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email OTP — LifeOS</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">LifeOS</div>
        <h2 style="font-size: 1.4rem; margin-top: 0.5rem;">Verify Your Email</h2>
        <p class="auth-subtitle">We sent a 6-digit OTP verification code to <strong id="target-email" style="color: var(--accent-primary);">your email</strong>.</p>
      </div>

      <form id="verify-otp-form">
        <div class="otp-inputs">
          <input type="text" maxlength="1" class="otp-digit" required autofocus>
          <input type="text" maxlength="1" class="otp-digit" required>
          <input type="text" maxlength="1" class="otp-digit" required>
          <input type="text" maxlength="1" class="otp-digit" required>
          <input type="text" maxlength="1" class="otp-digit" required>
          <input type="text" maxlength="1" class="otp-digit" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">Verify & Activate</button>
      </form>

      <div class="auth-footer" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
        <button id="resend-otp-btn" type="button" style="color: var(--accent-primary); font-size: 0.85rem;">Resend Code</button>
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
