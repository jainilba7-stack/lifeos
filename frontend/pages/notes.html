<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes — LifeOS</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="brand">LifeOS</div></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link"><span>📊</span> Dashboard</a>
        <a href="tasks.html" class="nav-link"><span>📝</span> Tasks</a>
        <a href="expenses.html" class="nav-link"><span>💰</span> Expenses & Budget</a>
        <a href="medicines.html" class="nav-link"><span>💊</span> Medicine Vault</a>
        <a href="documents.html" class="nav-link"><span>📂</span> Document Vault</a>
        <a href="goals.html" class="nav-link"><span>🎯</span> Goals</a>
        <a href="habits.html" class="nav-link"><span>🔥</span> Habit Tracker</a>
        <a href="appointments.html" class="nav-link"><span>📅</span> Appointments</a>
        <a href="notes.html" class="nav-link active"><span>📌</span> Notes</a>
        <a href="reminders.html" class="nav-link"><span>🔔</span> Reminders</a>
        <a href="analytics.html" class="nav-link"><span>📈</span> Analytics</a>
        <a href="emergency.html" class="nav-link"><span>🆘</span> Emergency Card</a>
        <a href="profile.html" class="nav-link"><span>⚙️</span> Settings & Profile</a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="logoutUser()" class="btn btn-danger" style="width: 100%;">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h2>Personal Notes</h2>
        <button id="add-note-btn" class="btn btn-primary">+ Create Note</button>
      </header>

      <main class="content-body">
        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
          <input type="text" id="note-search-input" class="form-control" placeholder="Search notes...">
          <select id="note-category-filter" class="form-control" style="width: 180px;">
            <option value="All">All Categories</option>
            <option value="Personal">Personal</option>
            <option value="College">College</option>
            <option value="Work">Work</option>
            <option value="Ideas">Ideas</option>
            <option value="Finance">Finance</option>
          </select>
        </div>

        <div id="notes-grid" class="notes-grid"></div>
      </main>
    </div>
  </div>

  <div id="note-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Create Note</h3>
        <button type="button" id="cancel-note-btn" style="color: var(--text-muted);">✕</button>
      </div>
      <form id="note-form">
        <div class="modal-body">
          <input type="hidden" id="note-id">
          <div class="form-group">
            <label for="note-title">Title</label>
            <input type="text" id="note-title" class="form-control" placeholder="Note title..." required>
          </div>
          <div class="form-group">
            <label for="note-content">Content</label>
            <textarea id="note-content" class="form-control" rows="6" placeholder="Write your thoughts..."></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label for="note-category">Category</label>
              <select id="note-category" class="form-control">
                <option value="Personal">Personal</option>
                <option value="College">College</option>
                <option value="Work">Work</option>
                <option value="Ideas">Ideas</option>
                <option value="Finance">Finance</option>
              </select>
            </div>
            <div class="form-group">
              <label for="note-tags">Tags (Comma separated)</label>
              <input type="text" id="note-tags" class="form-control" placeholder="e.g. project, exam">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Note</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notes.js"></script>
</body>
</html>
